<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bruder - Gestión de Productos</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<style>
	select option {
		color: black !important;
	}
</style>

<body class="bg-gradient-to-br from-[#0d1b2a] via-[#1b263b] to-[#415a77] min-h-screen flex font-sans text-gray-100">

	<!-- Sidebar -->
	<aside class="w-64 bg-[#1b263b]/90 backdrop-blur-md shadow-xl flex flex-col">
		<div class="flex items-center justify-center py-6 border-b border-[#415a77]/50">
			<a th:href="@{/login}">
				<img th:src="@{/images/bruder.png}" alt="Bruder Logo"
					class="w-20 h-20 mr-3 drop-shadow-md hover:scale-105 transition-transform duration-200">
			</a>
		</div>

		<nav class="flex-1 mt-4 px-3 space-y-2">

			<a th:href="@{/inicio}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-house-door text-xl"></i> <span>Inicio</span>
			</a>
			<a th:href="@{/cerveza/producto}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-box-seam text-xl"></i> <span>Producto</span>
			</a>
			<a th:href="@{/inventarioInicial}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-check text-xl"></i> <span>Inventario Inicial</span>
			</a>
			<a th:href="@{/inventarioFinal/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-data text-xl"></i> <span>Inventario Final</span>
			</a>
			<a th:href="@{/bajas/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-dash-circle text-xl"></i> <span>Bajas</span>
			</a>
			<a th:href="@{/despachos/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-truck text-xl"></i> <span>Despachos</span>
			</a>

			<a th:href="@{/produccion/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-gear-wide-connected text-xl"></i> <span>Producción</span>
			</a>
			<a th:href="@{/movimientos}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-arrow-left-right text-xl"></i> <span>Movimientos</span>
			</a>
			<a th:href="@{/puntosVenta}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-shop text-xl"></i> <span>Puntos de Distribución</span>
			</a>
		</nav>

		<!-- Cerrar Sesión -->
		<form th:action="@{/logout}" method="post" class="p-4 border-t border-[#415a77]/50">
			<button type="submit" class="w-full flex items-center justify-center gap-2
							   bg-red-600 hover:bg-red-700
							   text-white font-semibold
							   py-2.5 rounded-lg
							   shadow-md hover:shadow-lg
							   transition-all duration-200
							   focus:outline-none focus:ring-2 focus:ring-red-400">

				<i class="bi bi-box-arrow-right text-lg"></i>
				Cerrar sesión
			</button>
		</form>
	</aside>

	<!-- Main content -->
	<main class="flex-1 flex flex-col">

		<!-- Header -->
		<header class="flex items-center justify-between bg-[#1b263b]/80 backdrop-blur-sm px-8 py-4 shadow-lg">
			<h1 class="text-2xl font-semibold tracking-wide text-white">Gestión de Productos</h1>
			<div class="flex items-center gap-3">
				<i class="bi bi-person-circle text-2xl"></i>
				<span th:text="${nombreUsuario}" class="font-medium">Usuario</span>
			</div>
		</header>

		<!-- Contenido -->
		<section id="producto" class="p-10">
			<h2 class="text-3xl font-bold mb-8 text-white">🍺 Gestión de Productos</h2>

			<!-- Formulario -->
			<div class="bg-[#1b263b]/80 p-6 rounded-lg shadow-lg mb-8">
				<form id="formProducto" th:action="@{/cerveza/guardar}" th:object="${cerveza}" method="post"
					class="grid grid-cols-1 md:grid-cols-3 gap-6">
					<input type="hidden" th:field="*{id}" />

					<!-- Campo nombre -->
					<div>
						<label class="block mb-1 text-sm font-semibold text-[#e0e1dd]">Nombre</label>
						<input th:field="*{nombre}" required placeholder="Nombre de la Cerveza"
							class="w-full p-2 rounded bg-[#415a77]/30 border border-[#778da9] text-white focus:outline-none focus:ring-2 focus:ring-[#e0e1dd]" />
					</div>

					<!-- Select tipo -->
					<div>
						<label class="block mb-1 text-sm font-semibold text-[#e0e1dd]">Presentacion</label>
						<select th:field="*{tipo}" required
							class="w-full p-2 rounded bg-[#415a77]/30 border border-[#778da9] text-white focus:outline-none focus:ring-2 focus:ring-[#e0e1dd]">
							<option value="">Seleccionar Tipo</option>
							<option value="Barril">Barril</option>
							<option value="Botella">Botella</option>
						</select>
					</div>

					<!-- Botón guardar -->
					<div class="flex items-end">
						<button type="submit"
							class="bg-[#415a77] text-white px-6 py-2 rounded-lg hover:bg-[#778DA9] transition"> <i
								class="bi bi-save"></i> Guardar
						</button>
					</div>
				</form>
			</div>

			<!-- Tabla de productos -->
			<div class="bg-[#1b263b]/80 p-6 rounded-lg shadow-lg">
				<h2 class="text-2xl font-bold mb-4 text-[#e0e1dd]">Listado de Productos</h2>

				<div class="overflow-x-auto">
					<table class="min-w-full text-sm text-gray-200 border-collapse">
						<thead>
							<tr class="border-b border-[#415a77] text-[#e0e1dd] uppercase text-xs">
								<th class="py-3 px-4 text-left">ID</th>
								<th class="py-3 px-4 text-left">Nombre</th>
								<th class="py-3 px-4 text-left">Tipo</th>
								<th class="py-3 px-4 text-center">Estado</th>
								<th class="py-3 px-4 text-center">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="cerveza : ${cervezas}"
								class="border-t border-[#415a77]/50 hover:bg-[#415a77]/30">
								<td th:text="${cerveza.id}" class="py-2 px-4"></td>
								<td th:text="${cerveza.nombre}" class="py-2 px-4"></td>
								<td th:text="${cerveza.tipo}" class="py-2 px-4"></td>
								<td class="py-2 px-4 text-center">
									<span th:text="${cerveza.activo ? 'Activo' : 'Inactivo'}"
										th:classappend="${cerveza.activo} ? 'text-green-400' : 'text-red-400'"></span>
								</td>
								<td class="py-2 px-4 text-center space-x-3">
									<a th:href="@{'/cerveza/editar/' + ${cerveza.id}}" title="Editar"
										class="text-blue-400 hover:text-blue-600">
										<i class="bi bi-pencil-square text-lg"></i>
									</a>
									<a th:href="@{'/cerveza/cambiarEstado/' + ${cerveza.id}}"
										th:title="${cerveza.activo} ? 'Desactivar' : 'Activar'" th:class="
									      ${cerveza.activo} ?
									      'inline-flex items-center justify-center px-3 py-1 rounded-lg bg-green-600 hover:bg-green-700 text-white transition'
									      :
									      'inline-flex items-center justify-center px-3 py-1 rounded-lg bg-red-600 hover:bg-red-700 text-white transition'
									   ">
										<i class="bi bi-power text-lg"></i>
									</a>

								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</section>
		<footer class="text-center text-[#778DA9] text-sm py-4 border-t border-[#415a77]/40">
			<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍺</p>
		</footer>
	</main>

</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/cerveza.js}"></script>

</html>
