<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="${puntoVenta.id != null} ? 'Editar Punto de Venta - Bruder' : 'Nuevo Punto de Venta - Bruder'">
		Formulario</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/js/alertas-puntos-venta.js}"></script>

</head>

<body class="bg-gradient-to-br from-[#0d1b2a] via-[#1b263b] to-[#415a77] min-h-screen flex font-sans text-gray-100">
	<!-- Sidebar -->
	<aside class="w-64 bg-[#1b263b]/90 backdrop-blur-md shadow-xl flex flex-col">
		<div class="flex items-center justify-center py-6 border-b border-[#415a77]/50">
			<a th:href="@{/login}">
				<img th:src="@{/images/Bruder.png}" alt="Bruder Logo"
					class="w-20 h-20 mr-3 drop-shadow-md hover:scale-105 transition-transform duration-200">
			</a>
		</div>

		<nav class="flex-1 mt-4 px-3 space-y-2">
			<a th:href="@{/inicio}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-house-door text-xl"></i> <span>Inicio</span>
			</a>

			<a th:href="@{/cerveza/producto}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-box-seam text-xl"></i> <span>Producto</span>
			</a>
			<a th:href="@{/inventarioInicial}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-check text-xl"></i> <span>Inventario Inicial</span>
			</a>
			<a th:href="@{/inventarioFinal/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-data text-xl"></i> <span>Inventario Final</span>
			</a>
			<a th:href="@{/bajas/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-dash-circle text-xl"></i> <span>Bajas</span>
			</a>

			<a th:href="@{/despachos/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-truck text-xl"></i> <span>Despachos</span>
			</a>

			<a th:href="@{/produccion/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-gear-wide-connected text-xl"></i> <span>Producción</span>
			</a>
			<a th:href="@{/movimientos}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-arrow-left-right text-xl"></i> <span>Movimientos</span>
			</a>

			<a th:href="@{/puntosVenta}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-shop text-xl"></i> <span>Puntos de Distribución</span>
			</a>
		</nav>

		<!-- Cerrar Sesión -->
		<form th:action="@{/logout}" method="post" class="p-4 border-t border-[#415a77]/50">
			<button type="submit" class="w-full flex items-center justify-center gap-2
							   bg-red-600 hover:bg-red-700
							   text-white font-semibold
							   py-2.5 rounded-lg
							   shadow-md hover:shadow-lg
							   transition-all duration-200
							   focus:outline-none focus:ring-2 focus:ring-red-400">

				<i class="bi bi-box-arrow-right text-lg"></i>
				Cerrar sesión
			</button>
		</form>
	</aside>

	<!-- Contenido principal -->
	<main class="flex-1 flex flex-col">
		<header class="flex items-center justify-between bg-[#1b263b]/80 backdrop-blur-sm px-8 py-4 shadow-lg">
			<h1 class="text-2xl font-semibold tracking-wide text-white"
				th:text="${puntoVenta.id != null} ? 'Editar Punto de Venta' : 'Nuevo Punto de Venta'"></h1>
			<div class="flex items-center gap-3">
				<i class="bi bi-person-circle text-2xl"></i>
				<span th:text="${nombreUsuario}" class="font-medium">Usuario</span>
			</div>
		</header>

		<section class="flex justify-center items-center flex-1 px-8">

			<div class="bg-[#1b263b] p-10 rounded-2xl shadow-lg w-full max-w-2xl">
				<h2 class="text-3xl font-bold text-white text-center whitespace-nowrap">
					🍺 Nuevo Punto de Distribución
				</h2>
				<form th:action="@{/puntosVenta/guardar}" th:object="${puntoVenta}" method="post" class="space-y-4">
					<input type="hidden" th:field="*{id}" />

					<div>
						<label class="block mb-1">Nombre</label>
						<input type="text" th:field="*{nombre}" required
							class="w-full px-3 py-2 rounded bg-[#0d1b2a] border border-gray-600 focus:outline-none">
					</div>

					<div>
						<label class="block mb-1">Dirección</label>
						<input type="text" th:field="*{direccion}" required
							class="w-full px-3 py-2 rounded bg-[#0d1b2a] border border-gray-600 focus:outline-none">
					</div>

					<div class="flex items-center gap-2">
						<input type="checkbox" th:field="*{activo}" class="w-4 h-4">
						<label>Activo</label>
					</div>

					<div class="flex justify-between pt-4">
						<button type="button" onclick="confirmarCancelar('/puntosVenta')"
							class="flex items-center gap-2 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition">
							<i class="bi bi-x-circle"></i>
							Cancelar
						</button>


						<button type="button" onclick="confirmarGuardar(this.closest('form'))"
							class="bg-[#415a77] text-white px-6 py-2 rounded-lg hover:bg-[#778DA9] transition flex items-center gap-2">
							<i class="bi bi-save"></i>
							Guardar
						</button>

					</div>
				</form>
			</div>
		</section>
		<!-- Footer -->
		<footer class="text-center text-[#778DA9] text-sm py-4 border-t border-[#415a77]/40">
			<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍺</p>
		</footer>
	</main>
</body>

</html>
