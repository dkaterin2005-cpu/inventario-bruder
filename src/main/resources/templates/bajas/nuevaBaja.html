<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Nueva Baja - Bruder</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

	<style>
		/* Ocultar el icono nativo */
		input[type="date"]::-webkit-calendar-picker-indicator {
			opacity: 0;
			position: absolute;
			right: 10px;
			width: 20px;
			height: 20px;
			cursor: pointer;
		}

		/* Contenedor donde irá el icono personalizado */
		.date-wrapper {
			position: relative;
		}

		/* Icono de calendario blanco */
		.date-wrapper::after {
			content: "\f1e4";
			/* icono calendario bootstrap */
			font-family: 'bootstrap-icons';
			position: absolute;
			right: 12px;
			top: 50%;
			transform: translateY(-50%);
			font-size: 18px;
			color: white;
			/* BLANCO */
			pointer-events: none;
		}
	</style>
</head>

<body class="bg-gradient-to-br from-[#0d1b2a] via-[#1b263b] to-[#415a77] min-h-screen flex font-sans text-gray-100">

	<!-- Sidebar -->
	<aside class="w-64 bg-[#1b263b]/90 backdrop-blur-md shadow-xl flex flex-col">
		<div class="flex items-center justify-center py-6 border-b border-[#415a77]/50">
			<a th:href="@{/inicio}">
				<img th:src="@{/images/bruder.png}" alt="Bruder Logo"
					class="w-20 h-20 mr-3 drop-shadow-md hover:scale-105 transition-transform duration-200">
			</a>
		</div>

		<nav class="flex-1 mt-4 px-3 space-y-2">
			<a th:href="@{/inicio}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-house-door text-xl"></i> <span>Inicio</span>
			</a>
			<a th:href="@{/cerveza/producto}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-box-seam text-xl"></i> <span>Producto</span>
			</a>
			<a th:href="@{/inventarioInicial}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-check text-xl"></i> <span>Inventario Inicial</span>
			</a>
			<a th:href="@{/inventarioFinal/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-data text-xl"></i> <span>Inventario Final</span>
			</a>

			<!-- Selección actual -->
			<a th:href="@{/bajas/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#415a77]/60 transition">
				<i class="bi bi-dash-circle text-xl"></i> <span>Bajas</span>
			</a>

			<a th:href="@{/despachos/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-truck text-xl"></i> <span>Despachos</span>
			</a>

			<a th:href="@{/produccion/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-gear-wide-connected text-xl"></i> <span>Producción</span>
			</a>

			<a th:href="@{/movimientos}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-arrow-left-right text-xl"></i> <span>Movimientos</span>
			</a>

			<a th:href="@{/puntosVenta}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-shop text-xl"></i> <span>Puntos de Distribución</span>
			</a>
		</nav>

		<!-- Cerrar Sesión -->
		<form th:action="@{/logout}" method="post" class="p-4 border-t border-[#415a77]/50">
			<button type="submit" class="w-full flex items-center justify-center gap-2
							   bg-red-600 hover:bg-red-700
							   text-white font-semibold
							   py-2.5 rounded-lg
							   shadow-md hover:shadow-lg
							   transition-all duration-200
							   focus:outline-none focus:ring-2 focus:ring-red-400">

				<i class="bi bi-box-arrow-right text-lg"></i>
				Cerrar sesión
			</button>
		</form>
	</aside>

	<!-- CONTENIDO -->
	<main class="flex-1 flex flex-col">

		<!-- Header -->
		<header class="flex items-center justify-between bg-[#1b263b]/80 backdrop-blur-sm px-8 py-4 shadow-lg">
			<h1 class="text-2xl font-semibold tracking-wide text-white">Nueva Baja</h1>
			<div class="flex items-center gap-3">
				<i class="bi bi-person-circle text-2xl"></i>
				<span th:text="${nombreUsuario}" class="font-medium">Usuario</span>
			</div>
		</header>

		<!-- FORMULARIO -->
		<section class="p-10 max-w-3xl mx-auto w-full">
			<h2 class="text-3xl font-bold mb-8 text-white text-center">🍺 Registrar Nueva Baja</h2>

			<form id="formBaja" th:action="@{/bajas/guardar}" method="post"
				class="bg-[#1b263b]/60 backdrop-blur-md shadow-xl p-8 rounded-xl space-y-6">

				<!-- Producto -->
				<div>
					<label class="block mb-1 font-semibold">Producto</label>
					<select name="inventarioFinal.id"
						class="bg-[#0d1b2a] border border-[#415a77] rounded-lg p-2 w-full text-gray-100 focus:ring-2 focus:ring-[#778da9]">
						<option value="">Seleccione</option>
						<option th:each="inv : ${inventarioDisponible}" th:value="${inv.id}"
							th:text="${inv.cerveza.nombre + ' — Stock: ' + inv.cantidad}"></option>
					</select>
				</div>

				<!-- Cantidad -->
				<div>
					<label class="block mb-1 font-semibold">Cantidad</label>
					<input type="number" name="cantidad"
						class="bg-[#0d1b2a] border border-[#415a77] rounded-lg p-2 w-full text-gray-100 focus:ring-2 focus:ring-[#778da9]" />
				</div>

				<!-- Fecha de registro (fecha de la baja) -->
				<div>
					<label class="block mb-1 font-semibold">Fecha de registro</label>
					<div class="date-wrapper">
						<input type="date" name="fecha_registro" th:value="${T(java.time.LocalDate).now().toString()}"
							class="bg-[#0d1b2a] border border-[#415a77] rounded-lg p-2 pr-10 w-full text-gray-100 focus:ring-2 focus:ring-[#778da9]" />
					</div>
				</div>

				<!-- Motivo de la baja -->
				<div>
					<label class="block mb-1 font-semibold">Detalle de baja</label>
					<input type="text" name="razon" placeholder="Ingrese el motivo de la baja"
						class="bg-[#0d1b2a] border border-[#415a77] rounded-lg p-2 w-full text-gray-100 focus:ring-2 focus:ring-[#778da9]" />
				</div>

				<!-- Usuario -->
				<div>
					<label class="block mb-1 font-semibold">Usuario</label>
					<select name="usuario.id"
						class="bg-[#0d1b2a] border border-[#415a77] rounded-lg p-2 w-full text-gray-100 focus:ring-2 focus:ring-[#778da9]">
						<option value="">Seleccione</option>
						<option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
					</select>
				</div>

				<!-- Botones -->
				<div class="flex justify-center gap-4 pt-4">
					<button type="submit" id="btnGuardar"
						class="bg-[#415a77] text-white px-6 py-2 rounded-lg hover:bg-[#778DA9] transition shadow-md font-semibold">
						<i class="bi bi-check-circle"></i> Guardar
					</button>

					<a th:href="@{/bajas/listar}" id="btnCancelar"
						class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition shadow-md font-semibold">
						<i class="bi bi-x-circle"></i> Cancelar
					</a>
				</div>
			</form>
		</section>

		<footer class="text-center text-[#778DA9] text-sm py-4 border-t border-[#415a77]/40">
			<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍺</p>
		</footer>

	</main>

</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/bajas.js}"></script>

</html>
