<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Nueva Producción - Bruder</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
	/* Cambiar icono del calendario a blanco */
	input[type="date"]::-webkit-calendar-picker-indicator {
		filter: invert(1);
		cursor: pointer;
	}

	/* Mantener inputs oscuros SIEMPRE */
	input,
	textarea,
	select {
		background-color: #1b263b !important;
		color: #E0E1DD !important;
	}

	/* Cuando están enfocados */
	input:focus,
	textarea:focus,
	select:focus {
		background-color: #1b263b !important;
		color: #E0E1DD !important;
	}

	/* Autofill (Chrome / Edge) */
	input:-webkit-autofill,
	input:-webkit-autofill:hover,
	input:-webkit-autofill:focus,
	textarea:-webkit-autofill,
	select:-webkit-autofill {
		-webkit-box-shadow: 0 0 0px 1000px #1b263b inset !important;
		-webkit-text-fill-color: #E0E1DD !important;
		transition: background-color 9999s ease-in-out 0s;
	}
</style>


<body class="bg-gradient-to-br from-[#0d1b2a] via-[#1b263b] to-[#415a77] min-h-screen flex font-sans text-gray-100">

	<!-- Sidebar -->
	<aside class="w-64 bg-[#1b263b]/90 backdrop-blur-md shadow-xl flex flex-col">
		<div class="flex items-center justify-center py-6 border-b border-[#415a77]/50">
			<a th:href="@{/login}">
				<img src="https://i.ibb.co/v6csJZsZ/Bruder-craft-beer-lo.png" alt="Bruder-craft-beer-lo"
					class="w-40 h-auto">

				<!--<img th:src="@{/images/bruder.png}" alt="Bruder Logo"
							class="w-20 h-20 mr-3 drop-shadow-md hover:scale-105 transition-transform duration-200">-->
			</a>
		</div>

		<nav class="flex-1 mt-4 px-3 space-y-2">
			<a th:href="@{/inicio}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-house-door text-xl"></i> <span>Inicio</span>
			</a>
			<a th:href="@{/cerveza/producto}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-box-seam text-xl"></i> <span>Producto</span>
			</a>
			<a th:href="@{/inventarioInicial}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-check text-xl"></i> <span>Inventario Inicial</span>
			</a>
			<a th:href="@{/inventarioFinal/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-data text-xl"></i> <span>Inventario Final</span>
			</a>
			<a th:href="@{/bajas/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-dash-circle text-xl"></i> <span>Bajas</span>
			</a>
			<a th:href="@{/despachos/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-truck text-xl"></i> <span>Despachos</span>
			</a>
			<a th:href="@{/produccion/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-gear-wide-connected text-xl"></i> <span>Producción</span>
			</a>
			<a th:href="@{/movimientos}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-arrow-left-right text-xl"></i> <span>Movimientos</span>
			</a>
			<a th:href="@{/puntosVenta}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-shop text-xl"></i> <span>Puntos de Distribución</span>
			</a>
		</nav>

		<!-- Cerrar Sesión -->
		<form th:action="@{/logout}" method="post" class="p-4 border-t border-[#415a77]/50">
			<button type="submit" class="w-full flex items-center justify-center gap-2
							   bg-red-600 hover:bg-red-700
							   text-white font-semibold
							   py-2.5 rounded-lg
							   shadow-md hover:shadow-lg
							   transition-all duration-200
							   focus:outline-none focus:ring-2 focus:ring-red-400">

				<i class="bi bi-box-arrow-right text-lg"></i>
				Cerrar sesión
			</button>
		</form>
	</aside>

	<!-- Contenido principal -->
	<main class="flex-1 flex flex-col">
		<!-- Header -->
		<header class="flex items-center justify-between bg-[#1b263b]/80 backdrop-blur-sm px-8 py-4 shadow-lg">
			<h1 class="text-2xl font-semibold tracking-wide text-white">Nueva Producción</h1>
			<div class="flex items-center gap-3">
				<i class="bi bi-person-circle text-2xl"></i>
				<span th:text="${nombreUsuario}" class="font-medium">Usuario</span>
			</div>
		</header>

		<!-- Sección principal -->
		<section class="p-10 space-y-10">
			<h2 class="text-3xl font-bold text-white text-center">
				🍺 Registrar Nueva Producción
			</h2>

			<form id="formProduccion" th:action="@{/produccion/guardar}" th:object="${produccion}" method="post"
				class="bg-[#1b263b]/60 p-6 rounded-2xl shadow-lg border border-[#415a77]/40 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

				<div>
					<label class="block text-[#E0E1DD] mb-1">Fecha de Producción</label>
					<input type="date" th:field="*{fechaProduccion}" required
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]">
				</div>

				<div>
					<label class="block text-[#E0E1DD] mb-1">Cantidad (UND)</label>
					<input type="number" min="1" th:field="*{cantidad}" required
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]">
				</div>

				<div>
					<label class="block text-[#E0E1DD] mb-1">Fecha de Vencimiento</label>
					<input type="date" th:field="*{fechaVencimiento}" required
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]">
				</div>

				<div>
					<label class="block text-[#E0E1DD] mb-1">Lote</label>
					<input type="text" th:field="*{lote}"
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]">
				</div>

				<div>
					<label class="block text-[#E0E1DD] mb-1">Número de Barril</label>
					<input type="text" th:field="*{numBarril}"
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]">
				</div>

				<div>
					<label class="block text-[#E0E1DD] mb-1">Cerveza</label>
					<select class="w-full p-2 rounded-lg bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9]"
						th:field="*{cerveza}" required>

						<option value="">Seleccione...</option>
						<option th:each="c : ${cervezas}" th:value="${c.id}" th:text="${c.nombre}"></option>
					</select>
				</div>

				<div class="md:col-span-2 lg:col-span-3">
					<label class="block text-[#E0E1DD] mb-1">Observación</label>
					<textarea th:field="*{observacion}" rows="3"
						class="w-full rounded-lg p-2 bg-[#1b263b] text-[#E0E1DD] border border-[#778DA9] focus:outline-none focus:ring-2 focus:ring-[#778DA9]"></textarea>

				</div>

				<div class="md:col-span-2 lg:col-span-3 flex justify-between mt-4">
					<a href="#" onclick="confirmarCancelar('/produccion/listar')"
						class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition">
						<i class="bi bi-arrow-left-circle"></i> Cancelar
					</a>
					<button type="button" onclick="confirmarRegistrar(event)"
						class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition">
						<i class="bi bi-save"></i> Registrar
					</button>
				</div>
			</form>
		</section>

		<!-- Footer -->
		<footer class="text-center text-[#778DA9] text-sm py-4 border-t border-[#415a77]/40">
			<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍺</p>
		</footer>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/js/alertas-produccion.js}" defer></script>

</body>

</html>
