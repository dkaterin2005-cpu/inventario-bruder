<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Acceso denegado</title>
	<style>
		body {
			font-family: 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, #1b263b, #0d1b2a);
			color: white;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}

		.card {
			background: #ffffff;
			color: #1b263b;
			padding: 40px;
			border-radius: 12px;
			box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
			text-align: center;
			max-width: 420px;
		}

		h1 {
			font-size: 48px;
			margin-bottom: 10px;
			color: #c62828;
		}

		p {
			font-size: 16px;
			margin-bottom: 25px;
		}

		a {
			display: inline-block;
			background: #1b263b;
			color: white;
			padding: 10px 18px;
			border-radius: 6px;
			text-decoration: none;
			font-weight: 600;
		}

		a:hover {
			background: #415a77;
		}
	</style>
</head>

<body>
	<div class="card">
		<h1>403</h1>
		<p>No tienes permisos para acceder a esta sección.</p>
		<p>Si crees que es un error, contacta al administrador.</p>
		<a th:href="@{/inicio}">Volver al inicio</a>
		<a th:href="@{/logout}">Cerrar Sesión</a>
	</div>
</body>

</html>
