spring.application.name=Bruder

#puerto por defecto 8080 60607 52822 53774
#server.port= 0
server.port=${PORT:8080}
#conexion a base de datoso  o db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bruder_bd
spring.datasource.username=root
spring.datasource.password=root
#propiedades de JPA, cuando no estan las tablas en la db las crea
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.main.allow-circular-references=true
stripe.secret.key=${STRIPE_SECRET_KEY}


