<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bruder - Registro</title>
	<style>
		body {
			font-family: 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, #1b263b, #0d1b2a);
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		main {
			flex: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			padding-top: 30px;
			padding-bottom: 30px;
		}

		.book-container {
			width: 850px;
			height: 640px;
			background: #f9f9fb;
			border-radius: 15px;
			display: flex;
			box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
			overflow: hidden;
			position: relative;
		}

		.left-page {
			flex: 1;
			background: linear-gradient(160deg, rgba(27, 38, 59, 0.95), rgba(15, 32, 39, 0.95)),
				url('https://www.bruder.com.co/wp-content/uploads/bruder-cultura-cervecera-cervezas-llenas-experimentacion.jpg') center/cover;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			color: white;
			padding: 30px;
		}

		.logo {
			width: 120px;
			height: auto;
			margin-bottom: 20px;
			filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
		}

		.overlay-text {
			text-align: center;
		}

		.overlay-text h1 {
			font-size: 2.3rem;
			margin: 0;
			color: #e0e6ed;
			letter-spacing: 1px;
		}

		.overlay-text p {
			color: #cfd8dc;
			margin-top: 10px;
			font-size: 1rem;
		}

		.right-page {
			flex: 1;
			background-color: #ffffff;
			padding: 45px;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		h2 {
			text-align: center;
			color: #1b263b;
			margin-bottom: 25px;
			font-size: 28px;
			border-bottom: 2px solid #a8b8c8;
			padding-bottom: 10px;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		label {
			color: #1b263b;
			font-weight: 600;
		}

		input,
		select {
			padding: 10px;
			border: 1px solid #c5ced6;
			border-radius: 8px;
			font-size: 16px;
			outline: none;
			transition: 0.3s;
			background-color: #fdfdfd;
		}

		input:focus,
		select:focus {
			border-color: #415a77;
			box-shadow: 0 0 6px rgba(65, 90, 119, 0.5);
		}

		button {
			background-color: #1b263b;
			color: white;
			padding: 12px;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: 0.3s;
		}

		button:hover {
			background-color: #415a77;
		}

		.login-link {
			text-align: center;
			margin-top: 25px;
			font-size: 15px;
		}

		.login-link a {
			color: #415a77;
			text-decoration: none;
			font-weight: bold;
		}

		.login-link a:hover {
			text-decoration: underline;
		}

		.mensaje-error {
			color: #c62828;
			text-align: center;
			margin-bottom: 10px;
		}

		.mensaje-exito {
			color: #2e7d32;
			text-align: center;
			margin-bottom: 10px;
		}

		.book-container::before,
		.book-container::after {
			content: '';
			position: absolute;
			top: 0;
			width: 10px;
			height: 100%;
			background: #dfe6ed;
			z-index: 2;
		}

		.book-container::before {
			left: 50%;
		}

		.book-container::after {
			right: 0;
			background: #b0bec5;
		}

		footer {
			text-align: center;
			color: #778DA9;
			font-size: 14px;
			padding: 12px 0;
			border-top: 1px solid rgba(65, 90, 119, 0.4);
			width: 100%;
			background-color: transparent;
			margin-top: auto;
		}

		@media (max-height: 720px) {
			.book-container {
				transform: scale(0.9);
			}
		}
	</style>
</head>

<body>
	<main>
		<div class="book-container">
			<div class="left-page">
				<img th:src="@{/images/bruder.png}" alt="Logo Bruder" class="logo">
				<div class="overlay-text">
					<h1>Bruder</h1>
					<p>La tradición cervecera que crece contigo 🍺</p>
				</div>
			</div>

			<div class="right-page">
				<h2>Crear Cuenta</h2>

				<div th:if="${error}" class="mensaje-error" th:text="${error}"></div>
				<div th:if="${mensaje}" class="mensaje-exito" th:text="${mensaje}"></div>

				<form th:action="@{/registro}" method="post" th:object="${usuario}">
					<label for="nombre">Nombre completo</label>
					<input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre" required>

					<label for="correo">Correo electrónico</label>
					<input type="email" id="correo" th:field="*{correo}" placeholder="Correo Electrónico" required>

					<label for="password">Contraseña</label>
					<input type="password" id="password" th:field="*{password}" placeholder="Solo números (5 a 10)"
						required pattern="[0-9]{5,10}" inputmode="numeric"
						title="La contraseña debe contener solo números y tener entre 5 y 10 dígitos">

					<label for="tipo">Tipo de bodega</label>
					<select id="tipo" th:field="*{tipo}" required>
						<option value="" disabled selected>Selecciona una opción</option>
						<option value="Bodega">Bodega Principal</option>
						<option value="Distribuidora">Distribuidora</option>
					</select>

					<button type="submit">Registrar</button>
				</form>

				<div class="login-link">
					¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
				</div>
			</div>
		</div>
	</main>

	<footer>
		<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍻</p>
	</footer>
</body>

</html>
