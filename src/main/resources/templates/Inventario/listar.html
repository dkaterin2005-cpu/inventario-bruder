<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inventario Final - Bruder</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

	<div class="container mx-auto p-8">
		<h1 class="text-3xl font-bold mb-6 text-center text-yellow-400">📦 Inventario Final</h1>

		<div class="bg-gray-800 rounded-lg shadow-lg p-6">
			<table class="table-auto w-full text-center">
				<thead>
					<tr class="bg-gray-700 text-yellow-300">
						<th class="px-4 py-2">Inventario Inicial</th>
						<th class="px-4 py-2">Producción</th>
						<th class="px-4 py-2">Inventario Final</th>
					</tr>
				</thead>
				<tbody>
					<tr class="border-t border-gray-600">
						<td class="px-4 py-3" th:text="${totalInicial}"></td>
						<td class="px-4 py-3" th:text="${totalProduccion}"></td>
						<td class="px-4 py-3 font-semibold text-green-400" th:text="${totalFinal}"></td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

</body>

</html>
