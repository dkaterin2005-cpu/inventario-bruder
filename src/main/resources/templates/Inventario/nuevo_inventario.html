<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Nuevo Inventario Inicial - Bruder</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<style>
	/* Hace blanco el ícono del calendario dentro del input date */
	input[type="date"]::-webkit-calendar-picker-indicator {
		filter: invert(1);
		cursor: pointer;
	}
</style>

<body class="bg-gradient-to-br from-[#0d1b2a] via-[#1b263b] to-[#415a77] min-h-screen flex font-sans text-gray-100">

	<!-- Sidebar -->
	<aside class="w-64 bg-[#1b263b]/90 backdrop-blur-md shadow-xl flex flex-col">
		<div class="flex items-center justify-center py-6 border-b border-[#415a77]/50">
			<a th:href="@{/login}">
				<img src="https://i.ibb.co/v6csJZsZ/Bruder-craft-beer-lo.png" alt="Bruder-craft-beer-lo"
					class="w-40 h-auto">

				<!--<img th:src="@{/images/bruder.png}" alt="Bruder Logo"
							class="w-20 h-20 mr-3 drop-shadow-md hover:scale-105 transition-transform duration-200">-->
			</a>
		</div>

		<nav class="flex-1 mt-4 px-3 space-y-2">
			<a th:href="@{/inicio}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-house-door text-xl"></i> <span>Inicio</span>
			</a>
			<a th:href="@{/cerveza/producto}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-box-seam text-xl"></i> <span>Producto</span>
			</a>
			<a th:href="@{/inventarioInicial}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-check text-xl"></i> <span>Inventario Inicial</span>
			</a>
			<a th:href="@{/inventarioFinal/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-clipboard-data text-xl"></i> <span>Inventario Final</span>
			</a>
			<a th:href="@{/bajas/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-dash-circle text-xl"></i> <span>Bajas</span>
			</a>
			<a th:href="@{/despachos/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-truck text-xl"></i> <span>Despachos</span>
			</a>
			<a th:href="@{/produccion/listar}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-gear-wide-connected text-xl"></i> <span>Producción</span>
			</a>
			<a th:href="@{/movimientos}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-arrow-left-right text-xl"></i> <span>Movimientos</span>
			</a>

			<a th:href="@{/puntosVenta}"
				class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-[#415a77]/40 transition">
				<i class="bi bi-shop text-xl"></i> <span>Puntos de Distribución</span>
			</a>
		</nav>

		<!-- Cerrar Sesión -->
		<form th:action="@{/logout}" method="post" class="p-4 border-t border-[#415a77]/50">
			<button type="submit" class="w-full flex items-center justify-center gap-2
							   bg-red-600 hover:bg-red-700
							   text-white font-semibold
							   py-2.5 rounded-lg
							   shadow-md hover:shadow-lg
							   transition-all duration-200
							   focus:outline-none focus:ring-2 focus:ring-red-400">

				<i class="bi bi-box-arrow-right text-lg"></i>
				Cerrar sesión
			</button>
		</form>
	</aside>

	<!-- Contenido principal -->
	<main class="flex-1 flex flex-col">

		<!-- Header -->
		<header class="flex items-center justify-between bg-[#1b263b]/80 backdrop-blur-sm px-8 py-4 shadow-lg">
			<h1 class="text-2xl font-semibold tracking-wide text-white">Nuevo Inventario Inicial</h1>
			<div class="flex items-center gap-3">
				<i class="bi bi-person-circle text-2xl"></i>
				<span th:text="${nombreUsuario}" class="font-medium">Usuario</span>
			</div>
		</header>

		<!-- Formulario -->
		<section class="p-10 flex justify-center">
			<div class="bg-[#1b263b]/80 backdrop-blur-md p-10 rounded-2xl shadow-2xl w-full max-w-3xl">
				<h2 class="text-3xl font-bold mb-8 text-center text-white">🍺 Registrar Nuevo Inventario </h2>

				<form id="formInventarioInicial" th:action="@{/inventarioInicial/guardar}" th:object="${inventario}"
					method="post" class="space-y-6">

					<div>
						<label class="block mb-2 text-gray-300 font-semibold">Cerveza</label>
						<select id="cervezaSelect" th:field="*{cerveza}" required
							class="w-full bg-[#0d1b2a] text-gray-100 border border-[#415a77] rounded-lg p-3 focus:ring-2    focus:ring-[#778da9]">
							<option value="">Seleccione una cerveza</option>
							<option th:each="c : ${cervezas}" th:value="${c.id}" th:data-tipo="${c.tipo}"
								th:text="${c.nombre}">
							</option>
						</select>
					</div>

					<div>
						<label class="block mb-2 text-gray-300 font-semibold">Presentacion</label>
						<input type="text" id="tipoCerveza" readonly
							class="w-full bg-[#0d1b2a] text-gray-400 border border-[#415a77] rounded-lg p-3"
							placeholder="Seleccione una cerveza primero" />
					</div>

					<!-- Lote -->
					<div>
						<label class="block mb-2 text-gray-300 font-semibold">Lote</label>
						<input type="text" th:field="*{lote}" placeholder="Lote"
							class="w-full bg-[#0d1b2a] text-gray-100 border border-[#415a77] rounded-lg p-3 focus:ring-2 focus:ring-[#778da9]" />
					</div>

					<!-- Número de barril -->
					<div>
						<label class="block mb-2 text-gray-300 font-semibold">Número de Barril</label>
						<input type="text" th:field="*{numBarril}" placeholder="Numero de Barril"
							class="w-full bg-[#0d1b2a] text-gray-100 border border-[#415a77] rounded-lg p-3 focus:ring-2 focus:ring-[#778da9]" />
					</div>


					<!-- Cantidad -->
					<div>
						<label class="block mb-2 text-gray-300 font-semibold">Cantidad</label>
						<input type="number" th:field="*{cantidad}" min="0" step="0.01" required
							class="w-full bg-[#0d1b2a] text-gray-100 border border-[#415a77] rounded-lg p-3 focus:ring-2 focus:ring-[#778da9]" />
					</div>

					<!-- Fecha Registro -->
					<div>
						<label class="block mb-2 text-gray-300 font-semibold"> Fecha de Registro:</label>
						<input type="date" th:field="*{fechaRegistro}" required class="w-full px-4 py-2 rounded-lg bg-[#0d1b2a]/80 text-white border border-[#415a77]/40 
													focus:ring-2 focus:ring-[#778DA9]">
					</div>

					<!-- Botones -->
					<div class="flex justify-center gap-6 pt-6">

						<!-- Guardar -->
						<button type="button" onclick="confirmarGuardar()"
							class="bg-[#415a77] text-white px-6 py-2 rounded-lg hover:bg-[#778DA9] transition">
							<i class="bi bi-save"></i> Guardar
						</button>

						<!-- Cancelar -->
						<button type="button" onclick="confirmarCancelar()"
							class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">
							<i class="bi bi-x-circle"></i> Cancelar
						</button>
					</div>
				</form>
			</div>

		</section>
		<footer class="text-center text-[#778DA9] text-sm py-4 border-t border-[#415a77]/40">
			<p>© 2025 Bruder Cervecería Artesanal — Todos los derechos reservados 🍺</p>
		</footer>
	</main>
</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/inventarioInicial.js}"></script>
<script>
	document.addEventListener("DOMContentLoaded", () => {
		const select = document.getElementById("cervezaSelect");
		const tipoInput = document.getElementById("tipoCerveza");

		select.addEventListener("change", function () {
			const selectedOption = select.options[select.selectedIndex];
			const tipo = selectedOption.getAttribute("data-tipo");
			tipoInput.value = tipo || "";
		});
	});
</script>

</html>
